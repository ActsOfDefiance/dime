name: Feature Request
description: Suggest a new feature or enhancement
title: '[FEATURE] Brief description of the feature'
labels: ['✨ feature']
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a new feature!

  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description
      description: A clear and concise description of the feature you'd like to see.
      placeholder: Describe the feature...
    validations:
      required: true

  - type: textarea
    id: problem-statement
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? Why is it needed?
      placeholder: What problem does this solve?
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
      placeholder: How should this work?
    validations:
      required: true

  - type: textarea
    id: user-stories
    attributes:
      label: User Stories
      description: List the user stories for this feature
      placeholder: |
        - As a [user type], I want [feature] so that [benefit]
        - As a [user type], I want [feature] so that [benefit]
    validations:
      required: true

  - type: checkboxes
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: What needs to be true for this feature to be considered complete?
      options:
        - label: Feature works as described
          required: false
        - label: Tests are written and passing
          required: false
        - label: Documentation is updated
          required: false

  - type: textarea
    id: technical-considerations
    attributes:
      label: Technical Considerations
      description: Any technical details, constraints, or implementation thoughts.
      placeholder: Any technical notes...

  - type: textarea
    id: alternatives-considered
    attributes:
      label: Alternatives Considered
      description: Describe alternatives you've considered and why this approach is preferred.
      placeholder: What alternatives did you consider?

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, mockups, or examples about the feature request.
      placeholder: Any additional information...